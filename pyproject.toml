[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embezzlement-analysis"
version = "0.3.0"
description = "Evidence-oriented synthetic transaction analysis research baseline"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
eda = [
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<3.10",
    "nbformat>=5.9,<6",
    "nbclient>=0.9,<1",
    "nbconvert>=7,<8",
    "ipykernel>=6,<7",
    "scikit-learn>=1.3,<1.7",
]

[project.scripts]
embezzlement-analysis = "embezzlement_analysis.__main__:main"

[tool.setuptools.packages.find]
include = ["embezzlement_analysis*"]
